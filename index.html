<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dra. Margarita Esteban Herrero</title>
<meta name="description" content="Médica estética. Directora de Clínica ME Bilbao y presidenta de la Asociación GEMEON.">
<meta name="theme-color" content="#f6f1ea">

<!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, etc.) -->
<meta property="og:type" content="profile">
<meta property="og:title" content="Dra. Margarita Esteban Herrero">
<meta property="og:description" content="Médica estética · Directora de Clínica ME Bilbao · Presidenta de GEMEON">
<meta property="og:image" content="https://clinicamebilbao.com/wp-content/uploads/2025/02/Doctora-Margarita-Esteban-Herrero.jpeg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6f1ea;
    --card: #fffdfa;
    --ink: #2b2522;
    --muted: #7a6f68;
    --accent: #b08d6a;
    --accent-dark: #8c6b4c;
    --line: #e9e0d5;
    --wa: #25d366;
    --radius: 22px;
    --shadow: 0 20px 50px -20px rgba(80, 55, 35, .25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 400;
    color: var(--ink);
    background:
      radial-gradient(120% 60% at 50% 0%, #efe4d6 0%, transparent 70%),
      var(--bg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 36px 24px 26px;
    text-align: center;
    animation: rise .6s ease-out both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Foto / iniciales ---------- */
  .avatar {
    width: 128px;
    height: 128px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(140deg, #d9bf9f, var(--accent) 50%, #e8d6bf);
    position: relative;
  }
  .avatar img,
  .avatar .initials {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid var(--card);
    object-fit: cover;
    object-position: center 20%;
    display: block;
    background: #efe6da;
  }
  .avatar .initials {
    display: none;
    align-items: center;
    justify-content: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 44px;
    font-weight: 600;
    color: var(--accent-dark);
    letter-spacing: 1px;
  }
  .avatar.no-photo img { display: none; }
  .avatar.no-photo .initials { display: flex; }

  /* ---------- Texto ---------- */
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(27px, 7.4vw, 31px);
    line-height: 1.1;
    letter-spacing: .2px;
  }
  .role {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--accent-dark);
  }
  .org {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 300;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #faf6f0;
  }
  .badge strong { font-weight: 500; color: var(--ink); }

  .motto {
    margin: 22px auto 0;
    max-width: 300px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.35;
    color: var(--ink);
    position: relative;
  }
  .divider {
    width: 44px;
    height: 1px;
    background: var(--accent);
    margin: 22px auto;
    opacity: .7;
  }

  /* ---------- Botones de contacto ---------- */
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 92px;
    padding: 14px 6px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: #fbf8f4;
    color: var(--ink);
    text-decoration: none;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .action:active { transform: scale(.96); }
  @media (hover: hover) {
    .action:hover { background: #f4ece2; border-color: #dccbb6; }
  }
  .action .ico {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    background: var(--accent);
  }
  .action.whatsapp .ico { background: var(--wa); }
  .action svg { width: 22px; height: 22px; }

  /* ---------- Guardar contacto ---------- */
  .save {
    margin-top: 16px;
    width: 100%;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .4px;
    cursor: pointer;
    box-shadow: 0 10px 24px -12px rgba(43, 37, 34, .7);
    transition: transform .15s ease, background .2s ease;
  }
  .save:active { transform: scale(.98); }
  @media (hover: hover) { .save:hover { background: #3d3430; } }
  .save svg { width: 20px; height: 20px; }

  /* ---------- Redes ---------- */
  .social {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .social a {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    color: var(--accent-dark);
    background: var(--card);
    position: relative;
    transition: background .2s ease, color .2s ease, transform .15s ease;
  }
  .social a:active { transform: scale(.94); }
  @media (hover: hover) {
    .social a:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  }
  .social svg { width: 20px; height: 20px; }
  .social .tag {
    position: absolute;
    bottom: -4px;
    right: -4px;
    font-size: 9px;
    font-weight: 500;
    line-height: 1;
    padding: 3px 4px;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
  }

  .qr-btn {
    margin-top: 10px;
    width: 100%;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .4px;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .qr-btn:active { transform: scale(.98); }
  @media (hover: hover) { .qr-btn:hover { background: #f4ece2; } }
  .qr-btn svg { width: 20px; height: 20px; }

  /* ---------- Ventana del QR ---------- */
  #qrSheet { margin: auto; }
  .qr-box {
    width: 232px;
    height: 232px;
    margin: 6px auto 14px;
    padding: 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .qr-box canvas,
  .qr-box img { width: 100% !important; height: 100% !important; display: block; }
  .qr-url {
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 16px;
  }
  .qr-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .qr-actions button {
    min-height: 48px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #fbf8f4;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .qr-actions button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }

  .share {
    margin-top: 22px;
    background: none;
    border: 0;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
    padding: 8px;
  }

  footer {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #a89c93;
  }

  /* ---------- Selector de sede ---------- */
  dialog {
    border: 0;
    padding: 0;
    width: min(420px, calc(100% - 32px));
    margin: auto auto max(16px, env(safe-area-inset-bottom));
    border-radius: 24px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .35);
  }
  dialog::backdrop { background: rgba(43, 37, 34, .45); backdrop-filter: blur(2px); }
  dialog[open] { animation: sheet .25s ease-out; }
  @keyframes sheet {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .sheet { padding: 22px 18px 16px; text-align: center; }
  .sheet h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 23px;
    margin-bottom: 4px;
  }
  .sheet p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .sede {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fbf8f4;
    color: var(--ink);
    text-decoration: none;
    text-align: left;
  }
  .sede:active { background: #f4ece2; }
  .sede strong { display: block; font-weight: 500; font-size: 16px; }
  .sede span { font-size: 14px; color: var(--muted); }
  .sede svg { width: 18px; height: 18px; color: var(--accent-dark); flex: none; }
  .close {
    width: 100%;
    margin-top: 4px;
    padding: 12px;
    background: none;
    border: 0;
    font: inherit;
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
  }

  /* ---------- Aviso ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 340px) {
    .card { padding: 28px 16px 22px; }
    .actions { gap: 8px; }
    .action { min-height: 84px; font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

      const href = isWa ? "https://wa.me/" + s.phone.replace("+", "") : "tel:" + s.phone;
      const target = isWa ? ' target="_blank" rel="noopener"' : "";
      return `<a class="sede" href="${href}"${target}>
                <div><strong>${s.name}</strong><span>${s.display}</span></div>${arrow}
              </a>`;
    }).join("");

    if (typeof sheet.showModal === "function") {
      sheet.showModal();
    } else {
      // Navegadores muy antiguos: abre directamente la primera sede
      location.href = sheetOptions.querySelector("a").href;
    }
  }

  document.querySelectorAll("[data-sheet]").forEach(btn =>
    btn.addEventListener("click", () => openSheet(btn.dataset.sheet))
  );
  document.getElementById("closeSheet").addEventListener("click", () => sheet.close());
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
  sheetOptions.addEventListener("click", e => { if (e.target.closest("a")) setTimeout(() => sheet.close(), 300); });

  // ---------- vCard ----------
  function esc(v) {
    return String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  }

  function buildVCard() {
    const c = CONTACT;
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N;CHARSET=UTF-8:${esc(c.lastName)};${esc(c.firstName)};;${esc(c.prefix)};`,
      `FN;CHARSET=UTF-8:${esc(c.fullName)}`,
      `ORG;CHARSET=UTF-8:${esc(c.org)}`,
      `TITLE;CHARSET=UTF-8:${esc(c.title)}`,
      // Cada teléfono lleva su etiqueta de sede (iOS / macOS)
      ...c.sedes.flatMap((s, i) => [
        `item${i + 1}.TEL;TYPE=CELL,VOICE:${s.phone}`,
        `item${i + 1}.X-ABLabel:${s.name}`
      ]),
      `EMAIL;TYPE=INTERNET,WORK:${c.email}`,
      `URL;TYPE=WORK:${c.web}`,
      `X-SOCIALPROFILE;TYPE=linkedin:${c.linkedin}`,
      ...c.instagram.map(u => `X-SOCIALPROFILE;TYPE=instagram:${u}`),
      `PHOTO;VALUE=URI:${c.photo}`,
      `NOTE;CHARSET=UTF-8:${esc(c.note + "\nBilbao: " + c.sedes[0].display + " · Madrid: " + c.sedes[1].display)}`,
      "END:VCARD"
    ];
    return lines.join("\r\n") + "\r\n";
  }

  document.getElementById("saveContact").addEventListener("click", () => {
    const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Dra-Margarita-Esteban-Herrero.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Contacto descargado");
  });

  // ---------- Compartir ----------
  async function copyLink() {
    try {
      await navigator.clipboard.writeText(PAGE_URL);
      toast("Enlace copiado");
    } catch (e) {
      prompt("Copia este enlace:", PAGE_URL);
    }
  }

  document.getElementById("share").addEventListener("click", async () => {
    const data = { title: CONTACT.fullName, text: "Tarjeta de " + CONTACT.fullName, url: PAGE_URL };
    if (navigator.share) {
      try { await navigator.share(data); } catch (e) { /* el usuario canceló */ }
    } else {
      copyLink();
    }
  });

  // ---------- Código QR ----------
  const qrSheet = document.getElementById("qrSheet");
  const qrBox = document.getElementById("qrCode");
  document.getElementById("qrUrl").textContent = PAGE_URL.replace(/^https?:\/\//, "");

  function renderQr() {
    if (qrBox.childElementCount || typeof QRCode === "undefined") return;
    new QRCode(qrBox, {
      text: PAGE_URL,
      width: 600,
      height: 600,
      colorDark: "#2b2522",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  document.getElementById("showQr").addEventListener("click", () => {
    renderQr();
    if (!qrBox.childElementCount) qrBox.textContent = "No se pudo generar el QR. Comprueba la conexión.";
    if (typeof qrSheet.showModal === "function") qrSheet.showModal();
  });
  document.getElementById("closeQr").addEventListener("click", () => qrSheet.close());
  qrSheet.addEventListener("click", e => { if (e.target === qrSheet) qrSheet.close(); });
  document.getElementById("copyLink").addEventListener("click", copyLink);

  document.getElementById("downloadQr").addEventListener("click", () => {
    const canvas = qrBox.querySelector("canvas");
    if (!canvas) return;
    // Añade un margen blanco para que el QR se lea bien al imprimirlo
    const pad = 60;
    const out = document.createElement("canvas");
    out.width = canvas.width + pad * 2;
    out.height = canvas.height + pad * 2;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(canvas, pad, pad);
    const a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = "QR-Dra-Margarita-Esteban-Herrero.png";
    a.click();
    toast("QR descargado");
  });

  // ---------- Aviso ----------
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
</script>
</body>
</html>
